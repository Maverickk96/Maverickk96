name: 🕹️ Generate Contribution Games (Pac-Man + Snake)

# Both games are generated in ONE workflow and pushed in ONE commit.
# Why: the publish step replaces the contents of the `output` branch, so two
# separate workflows would keep wiping each other's SVGs.

on:
  schedule:
    # every 12 hours — fresh graphs without burning Action minutes
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────
      #  PAC-MAN  →  dist/pacman-contribution-graph{,-dark}.svg
      # ─────────────────────────────────────────────────────────────
      - name: Generate Pac-Man graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-contribution-graph.svg?gameTheme=github-light
            dist/pacman-contribution-graph-dark.svg?gameTheme=github-dark

      # ─────────────────────────────────────────────────────────────
      #  SNAKE  →  dist/snake{,-dark}.svg
      # ─────────────────────────────────────────────────────────────
      - name: Generate Snake graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#e23636&color_dots=#161b22,#5c1a1f,#a3262e,#e23636,#ff6b6b

      # ─────────────────────────────────────────────────────────────
      #  PUBLISH  →  branch: output
      # ─────────────────────────────────────────────────────────────
      - name: Push everything to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
